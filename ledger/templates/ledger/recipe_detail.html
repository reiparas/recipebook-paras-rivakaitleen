{% extends "ledger/base.html" %}

{% block content %}
<h2>{{ recipe.name }} Ingredients</h2>

<ul>
    {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient.name }} — {{ ingredient.quantity }}
        </li>
    {% endfor %}
</ul>

<a href="{% url 'recipe_list' %}">Back</a>

{% endblock %}
