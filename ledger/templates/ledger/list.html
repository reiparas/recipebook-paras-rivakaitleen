{% extends "ledger/base.html" %}

{% block page_title %}
Recipe List
{% endblock %}

{% block content %}

{% if user.is_authenticated %}
    <a href="{% url 'recipe_add' %}">Add New Recipe</a>
{% endif %}

<h2>Recipes</h2>

<ul>
    {% for recipe in recipes %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
    {% empty %}
        <li>No recipes yet.</li>
    {% endfor %}
</ul>

{% endblock %}
